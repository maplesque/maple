name: CodSpeed

on:
  push:
    branches:
      - trunk
      - main
  # Required to get performance reports on pull requests.
  pull_request:
  # Lets CodSpeed trigger backtest runs to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RUSTFLAGS: -C target-cpu=generic

jobs:
  benchmarks:
    name: Run benchmarks
    # Walltime requires CodSpeed's stable ARM64 bare-metal environment so
    # syscall-heavy benchmarks include their complete elapsed time.
    runs-on: codspeed-macro

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: codspeed-${{ runner.arch }}

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build the benchmarks
        run: cargo codspeed build --profile codspeed --measurement-mode walltime --locked --jobs 1

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          # The end-to-end GIF/WebP benchmarks spend substantial time in
          # syscalls, which CPU Simulation deliberately excludes.
          mode: walltime
          run: cargo codspeed run --measurement-mode walltime
