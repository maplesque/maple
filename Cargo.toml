[package]
name = "maple"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
gif = "0.13"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
eyre = "0.6"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
delaunator = "1.0"
ab_glyph = "0.2"
imageproc = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[[bin]]
name = "maple"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies.mimalloc]
version = "0.1"
default-features = false

[dependencies.rayon]
version = "1.10"
